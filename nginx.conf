server {
    listen 8080;
    server_name _;
    server_tokens off;
    # The gateway owns sanitized request logs; inherited combined logs expose recovery queries.
    access_log off;
    # Native request errors include unsanitized URIs; gateway status telemetry owns diagnostics.
    error_log /dev/null;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;

    location = /health/live { access_log off; return 200 'ok'; }
    location = /health/ready { access_log off; try_files /index.html =503; }
    # Gateway owns these routes; do not turn a missing API into a successful SPA response.
    location /api/ { return 404; }
    location /oauth/ { return 404; }
    location /.well-known/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
